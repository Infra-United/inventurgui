[project]
name = "inventurgui"
version = "0.1.0"
description = "This is a simple Python GUI that displays data from table sheets (.ods) on a Website in a nice way. It is used for inventory management in organizations that lend stuff for free or vs donations."
authors = [{ name = "whoami", email = "schmusi@systemli.org" }]
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.11.0",
    "nicegui>=3.7.1",
    "i18n-modern[yaml]>=0.2.1",
    "python-slugify>=8.0.4",
    "polars>=1.39.0",
    "fastexcel>=0.19.0",
    "ezodf>=0.3.2",
    "webdav4>=0.11.0",
    "lxml>=6.0.2",
    "adbc-driver-sqlite>=1.10.0",
    "xlsxwriter>=3.2.9",
    "email-validator>=2.3.0",
    "pillow>=12.1.1",
    "beautifulsoup4>=4.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inventurgui"]

[project.scripts]
inventurgui = "inventurgui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
