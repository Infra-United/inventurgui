[project]
name = "niceshare"
version = "0.1.0"
description = "This is a simple Python GUI that displays data from table sheets (.ods) on a Website in a nice way. It is used for inventory management in organizations that lend stuff for free or vs donations."
authors = [{ name = "whoami", email = "schmusi@systemli.org" }]
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "pydantic-settings>=2",
    "pyjwt>=2",
    "nicegui>=3",
    "i18n-modern[yaml]>=0.2",
    "python-slugify>=8",
    "polars>=1",
    "fastexcel>=0.19",
    "ezodf>=0.3.2",
    "webdav4>=0.11.0",
    "lxml>=6.0.2",
    "xlsxwriter>=3.2.9",
    "email-validator>=2.3.0",
    "pillow>=12",
    "beautifulsoup4>=4",
    "qrcode>=8",
    "duckdb>=1",
    "pyarrow>=23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/niceshare"]

[project.scripts]
niceshare = "niceshare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
